{{- if and (eq .Values.database "mongo") (not .Values.mongo.existingSecret) }}
{{- $secretName := include "pacman.mongo.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $metadata := dict -}}
{{- if $existingSecret -}}
  {{- $metadata = default dict (get $existingSecret "metadata") -}}
{{- end -}}
{{- $labels := default dict (get $metadata "labels") -}}
{{- $annotations := default dict (get $metadata "annotations") -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
  {{- $existingData = default dict (get $existingSecret "data") -}}
{{- end -}}
{{- $owned := and $existingSecret (eq (get $labels "app.kubernetes.io/managed-by") "Helm") (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) -}}
{{- if and $owned (not (and (hasKey $existingData "database-admin-name") (hasKey $existingData "database-admin-password") (hasKey $existingData "database-name") (hasKey $existingData "database-user") (hasKey $existingData "database-password"))) -}}
  {{- fail "existing Helm-managed Mongo Secret is missing expected credential keys; restore it before upgrading" -}}
{{- end -}}
{{- $secretData := dict -}}
{{- if $owned -}}
  {{- $secretData = dict
    "database-admin-name" (index $existingData "database-admin-name")
    "database-admin-password" (index $existingData "database-admin-password")
    "database-name" (index $existingData "database-name")
    "database-user" (index $existingData "database-user")
    "database-password" (index $existingData "database-password")
  -}}
{{- else -}}
  {{- $secretData = dict
    "database-admin-name" (required "mongo.auth.rootUsername must be set" .Values.mongo.auth.rootUsername | b64enc)
    "database-admin-password" (required "mongo.auth.rootPassword must be set" .Values.mongo.auth.rootPassword | b64enc)
    "database-name" (required "mongo.auth.databaseName must be set" .Values.mongo.auth.databaseName | b64enc)
    "database-user" (required "mongo.auth.databaseUser must be set" .Values.mongo.auth.databaseUser | b64enc)
    "database-password" (required "mongo.auth.databasePassword must be set" .Values.mongo.auth.databasePassword | b64enc)
  -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels: {{- include "pacman.mongo.labels" $ | nindent 4 }}
type: Opaque
data:{{- toYaml $secretData | nindent 2 }}
{{- end }}
{{- if and (eq .Values.database "postgres") (not .Values.postgres.existingSecret) }}
{{- $secretName := include "pacman.postgres.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $metadata := dict -}}
{{- if $existingSecret -}}
  {{- $metadata = default dict (get $existingSecret "metadata") -}}
{{- end -}}
{{- $labels := default dict (get $metadata "labels") -}}
{{- $annotations := default dict (get $metadata "annotations") -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
  {{- $existingData = default dict (get $existingSecret "data") -}}
{{- end -}}
{{- $owned := and $existingSecret (eq (get $labels "app.kubernetes.io/managed-by") "Helm") (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) -}}
{{- if and $owned (not (and (hasKey $existingData "username") (hasKey $existingData "password") (hasKey $existingData "database"))) -}}
  {{- fail "existing Helm-managed PostgreSQL Secret is missing expected credential keys; restore it before upgrading" -}}
{{- end -}}
{{- $secretData := dict -}}
{{- if $owned -}}
  {{- $secretData = dict
    "username" (index $existingData "username")
    "password" (index $existingData "password")
    "database" (index $existingData "database")
  -}}
{{- else -}}
  {{- $secretData = dict
    "username" (required "postgres.auth.username must be set" .Values.postgres.auth.username | b64enc)
    "password" (required "postgres.auth.password must be set" .Values.postgres.auth.password | b64enc)
    "database" (required "postgres.auth.database must be set" .Values.postgres.auth.database | b64enc)
  -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels: {{- include "pacman.postgres.labels" $ | nindent 4 }}
type: Opaque
data:{{- toYaml $secretData | nindent 2 }}
{{- end }}
