name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  attestations: write

concurrency:
  group: pacman-release
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/saintdle/pacman

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Manual releases must target the main branch (got $GITHUB_REF)" >&2
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Resolve release version
        id: version
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          release_output=$(node tools/resolve-release-version.js)
          printf '%s\n' "$release_output" >> "$GITHUB_OUTPUT"
          version=$(printf '%s\n' "$release_output" | awk -F= '$1 == "version" { print $2 }')
          source=$(printf '%s\n' "$release_output" | awk -F= '$1 == "source" { print $2 }')
          echo "Publishing Pac-Man $version ($source)"

      - name: Write release metadata
        if: steps.version.outputs.existing_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            '{version: $version, tag: $tag, commit: $commit}' \
            > release-metadata.json
          cat release-metadata.json

      - name: Ensure release tag is unused
        if: steps.version.outputs.existing_release != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish multi-architecture image
        id: build
        if: steps.version.outputs.existing_release != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: steps.version.outputs.existing_release != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published image for vulnerabilities
        id: trivy
        if: steps.version.outputs.existing_release != 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Open vulnerability issue
        if: ${{ always() && steps.version.outputs.existing_release != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! -s trivy-results.json ]]; then
            echo "::warning::Trivy did not produce a result file; no vulnerability issue created."
            exit 0
          fi

          vulnerability_count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [[ "$vulnerability_count" -eq 0 ]]; then
            echo "Trivy found no reportable vulnerabilities."
            exit 0
          fi

          issue_title="Security: vulnerabilities in ${IMAGE_NAME}:${RELEASE_VERSION}"
          existing_issue=$(gh issue list \
            --state open \
            --limit 100 \
            --json number,title \
            | jq -r --arg title "$issue_title" '.[] | select(.title == $title) | .number' \
            | head -n 1)
          if [[ -n "$existing_issue" ]]; then
            echo "Vulnerability issue #$existing_issue already exists for $RELEASE_VERSION."
            exit 0
          fi

          vulnerability_details=$(jq -r '
            [.Results[]?.Vulnerabilities[]?]
            | sort_by(.Severity, .VulnerabilityID)
            | .[]
            | "- **\(.VulnerabilityID)** (\(.Severity)) in `\(.PkgName)` \(.InstalledVersion) -> \(.FixedVersion // "no fixed version")\n  \(.Title // "No title")\n  \(.PrimaryURL // "No advisory URL")"
          ' trivy-results.json)

          {
            printf '%s\n\n' '## Trivy vulnerability report'
            printf 'The release image contains **%s** reportable vulnerability(ies).\n\n' "$vulnerability_count"
            printf '%s\n\n' "- Image: ${IMAGE_NAME}:${RELEASE_VERSION}"
            printf '%s\n\n' "- Digest: ${IMAGE_NAME}@${IMAGE_DIGEST:-unknown}"
            printf '%s\n\n' "- Release: [${RELEASE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            printf '%s\n\n' "- Source commit: [${SOURCE_COMMIT}](https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT})"
            printf '%s\n\n' 'The scan is configured for HIGH and CRITICAL vulnerabilities with available fixes.'
            printf '%s\n' "$vulnerability_details"
          } > vulnerability-issue.md

          gh issue create \
            --title "$issue_title" \
            --body-file vulnerability-issue.md

      - name: Verify published manifest list
        id: image
        env:
          VERSION_TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          inspect_digest() {
            local reference="$1"
            local attempt
            local output
            local exit_code
            local digest

            for attempt in 1 2 3 4 5; do
              if output=$(docker buildx imagetools inspect "$reference" 2>&1); then
                digest=$(printf '%s\n' "$output" | awk '/^Digest:/ { print $2; exit }')
                if [[ -n "$digest" ]]; then
                  printf '%s\n' "$digest"
                  return 0
                fi
                echo "Attempt $attempt: no digest returned for $reference" >&2
              else
                exit_code=$?
                echo "Attempt $attempt: failed to inspect $reference (exit $exit_code)" >&2
                printf '%s\n' "$output" >&2
              fi
              if (( attempt < 5 )); then sleep 10; fi
            done

            return 1
          }

          if ! version_digest=$(inspect_digest "$IMAGE_NAME:$VERSION_TAG"); then
            echo "Unable to inspect $IMAGE_NAME:$VERSION_TAG after 5 attempts" >&2
            exit 1
          fi
          if ! latest_digest=$(inspect_digest "$IMAGE_NAME:latest"); then
            echo "Unable to inspect $IMAGE_NAME:latest after 5 attempts" >&2
            exit 1
          fi
          if [[ "$version_digest" != "$latest_digest" ]]; then
            echo "Manifest digest mismatch: $IMAGE_NAME:$VERSION_TAG=$version_digest, $IMAGE_NAME:latest=$latest_digest" >&2
            exit 1
          fi
          echo "image_digest=$version_digest" >> "$GITHUB_OUTPUT"
          echo "Verified $IMAGE_NAME:$VERSION_TAG and $IMAGE_NAME:latest at $version_digest"

      - name: Install Cosign
        if: steps.version.outputs.existing_release != 'true'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign published image digest
        if: steps.version.outputs.existing_release != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Create GitHub release
        if: steps.version.outputs.existing_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Published Pac-Man ${RELEASE_VERSION}.

          - Image: ${IMAGE_NAME}:${RELEASE_VERSION}
          - Digest: ${IMAGE_DIGEST}
          - Platforms: linux/amd64, linux/arm64
          - Image provenance, SBOM, and keyless signature published with the image.
          - latest points to the same manifest list.
          EOF
          gh release create "$RELEASE_TAG" \
            release-metadata.json \
            --target "$GITHUB_SHA" \
            --title "Pac-Man $RELEASE_VERSION" \
            --notes-file "$notes"

      - name: Dispatch Helm chart promotion
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_AUTOMATION_TOKEN" || {
            echo "RELEASE_AUTOMATION_TOKEN is required to promote helm-charts" >&2
            exit 1
          }
          payload=$(jq -n \
            --arg app_version "$RELEASE_VERSION" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg source_commit "$GITHUB_SHA" \
            '{event_type: "pacman-release", client_payload: {app_version: $app_version, image_digest: $image_digest, source_commit: $source_commit}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_AUTOMATION_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/saintdle/helm-charts/dispatches \
            -d "$payload"