name: Kubernetes examples

on:
  push:
    branches: [main, master]
    paths:
      - "k8s/**"
      - "docker/Dockerfile"
      - "src/**"
      - "public/**"
      - "views/**"
      - "proto/**"
      - "package.json"
      - "package-lock.json"
      - "demo-fixtures/synthetic-secret.txt"
      - "tools/healthcheck.js"
      - "tools/demo-exec-probe.js"
      - "tools/check-container-image-contract.js"
      - "tools/smoke-container-images.js"
      - "tools/check-kubernetes-image-identity.js"
      - "test/container-image-contract.test.js"
      - "test/container-image-identity.test.js"
      - ".github/workflows/k8s-examples.yml"
  pull_request:
    paths:
      - "k8s/**"
      - "docker/Dockerfile"
      - "src/**"
      - "public/**"
      - "views/**"
      - "proto/**"
      - "package.json"
      - "package-lock.json"
      - "demo-fixtures/synthetic-secret.txt"
      - "tools/healthcheck.js"
      - "tools/demo-exec-probe.js"
      - "tools/check-container-image-contract.js"
      - "tools/smoke-container-images.js"
      - "tools/check-kubernetes-image-identity.js"
      - "test/container-image-contract.test.js"
      - "test/container-image-identity.test.js"
      - ".github/workflows/k8s-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind-smoke:
    name: Build and smoke-test Kubernetes examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Freeze checked-out source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          checkout_sha=$(git rev-parse HEAD)
          if [[ "$checkout_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out source $checkout_sha does not match event source $GITHUB_SHA." >&2
            exit 1
          fi
          image_tag="docker.io/library/pacman:ci-${checkout_sha}"
          {
            echo "PACMAN_CHECKOUT_SHA=$checkout_sha"
            echo "PACMAN_IMAGE=$image_tag"
          } >> "$GITHUB_ENV"
          printf 'Checked-out source: %s\n' "$checkout_sha"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            printf 'Pull request head: %s\nSynthetic merge checkout: %s\n' "$PR_HEAD_SHA" "$checkout_sha"
          fi

      - name: Build and smoke-test the exact candidate image
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file docker/Dockerfile \
            --build-arg COMMIT_SHA="$PACMAN_CHECKOUT_SHA" \
            --tag "$PACMAN_IMAGE" \
            .
          image_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PACMAN_IMAGE")
          image_id=$(docker image inspect --format '{{.Id}}' "$PACMAN_IMAGE")
          if [[ "$image_revision" != "$PACMAN_CHECKOUT_SHA" ]]; then
            echo "Built image revision $image_revision does not match checked-out source $PACMAN_CHECKOUT_SHA." >&2
            exit 1
          fi
          printf 'PACMAN_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'Candidate image: %s\nSource: %s\nImage ID: %s\n' "$PACMAN_IMAGE" "$image_revision" "$image_id"
          node tools/smoke-container-images.js \
            --expected-revision "$PACMAN_CHECKOUT_SHA" \
            "linux/amd64=$PACMAN_IMAGE"

      - name: Install Kind with checksum retries
        env:
          KIND_VERSION: v0.30.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) kind_arch=amd64 ;;
            aarch64|arm64) kind_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          kind_dir="${RUNNER_TOOL_CACHE}/kind/${KIND_VERSION}/${kind_arch}/kind/bin"
          mkdir -p "$kind_dir"

          for attempt in 1 2 3 4 5; do
            temp_dir=$(mktemp -d)
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
                -o "$temp_dir/kind-linux-${kind_arch}" \
                "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${kind_arch}" \
              && curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
                -o "$temp_dir/kind-linux-${kind_arch}.sha256sum" \
                "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${kind_arch}.sha256sum" \
              && (
                cd "$temp_dir"
                grep -F "kind-linux-${kind_arch}" "kind-linux-${kind_arch}.sha256sum" | sha256sum -c --status
              ); then
              install -m 0755 "$temp_dir/kind-linux-${kind_arch}" "$kind_dir/kind"
              rm -rf "$temp_dir"
              echo "$kind_dir" >> "$GITHUB_PATH"
              exit 0
            fi

            rm -rf "$temp_dir"
            echo "Kind download or checksum verification failed (attempt ${attempt}/5)." >&2
            if (( attempt < 5 )); then
              sleep 2
            fi
          done

          echo "Unable to install Kind ${KIND_VERSION} after five checksum-verified attempts." >&2
          exit 1

      - name: Create owned Kind cluster and kubeconfig
        run: |
          set -euo pipefail
          cluster_name="pacman-k8s-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          namespace="pacman-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubeconfig="${RUNNER_TEMP}/${cluster_name}.kubeconfig"
          {
            echo "PACMAN_CLUSTER_NAME=$cluster_name"
            echo "PACMAN_NAMESPACE=$namespace"
            echo "PACMAN_KUBECONFIG=$kubeconfig"
          } >> "$GITHUB_ENV"
          kind create cluster \
            --name "$cluster_name" \
            --image kindest/node:v1.31.4 \
            --wait 120s \
            --kubeconfig "$kubeconfig"
          kind load docker-image "$PACMAN_IMAGE" --name "$cluster_name"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install local storage provisioner
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" patch storageclass local-path \
            -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" wait --for=condition=available deployment/local-path-provisioner \
            -n local-path-storage --timeout=120s

      - name: Render isolated candidate overlays and validate manifests
        run: |
          set -euo pipefail
          overlay_root="${RUNNER_TEMP}/pacman-k8s-overlays"
          multi_dir="${overlay_root}/multi-role"
          postgres_dir="${overlay_root}/postgres"
          mkdir -p "$multi_dir" "$postgres_dir" "$overlay_root/base"
          cp -R "$GITHUB_WORKSPACE/k8s/examples" "$overlay_root/base/examples"

          cat > "$multi_dir/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: ${PACMAN_NAMESPACE}
          resources:
            - ../base/examples
          images:
            - name: docker.io/saintdle/pacman
              newName: docker.io/library/pacman
              newTag: ci-${PACMAN_CHECKOUT_SHA}
          patches:
            - target:
                version: v1
                kind: Namespace
                name: pacman-demo
              patch: |-
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ${PACMAN_NAMESPACE}
            - target:
                group: apps
                version: v1
                kind: Deployment
                name: pacman-web
              patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: pacman-web
                spec:
                  template:
                    spec:
                      containers:
                        - name: pacman
                          env:
                            - name: SCORE_SERVICE_URL
                              value: http://pacman-score.${PACMAN_NAMESPACE}.svc:8080
                            - name: USER_SERVICE_URL
                              value: http://pacman-user.${PACMAN_NAMESPACE}.svc:8080
          EOF

          cat > "$postgres_dir/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: ${PACMAN_NAMESPACE}
          resources:
            - ../base/examples/postgres-example.yaml
          images:
            - name: docker.io/saintdle/pacman
              newName: docker.io/library/pacman
              newTag: ci-${PACMAN_CHECKOUT_SHA}
          patches:
            - target:
                version: v1
                kind: Namespace
                name: pacman-demo
              patch: |-
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ${PACMAN_NAMESPACE}
          EOF

          multi_manifest="${RUNNER_TEMP}/pacman-multi-role.yaml"
          postgres_manifest="${RUNNER_TEMP}/pacman-postgres.yaml"
          kubectl kustomize --load-restrictor=LoadRestrictionsNone "$multi_dir" > "$multi_manifest"
          kubectl kustomize --load-restrictor=LoadRestrictionsNone "$postgres_dir" > "$postgres_manifest"
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" create namespace "$PACMAN_NAMESPACE"
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" apply --dry-run=server -f "$multi_manifest"
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" apply --dry-run=server -f "$postgres_manifest"

          # Optional policy and observability examples need their controller
          # CRDs, so validate their Kubernetes shape without applying them to
          # the plain Kind cluster.
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.31.0 \
            k8s/examples/cilium-l7-policy.yaml \
            k8s/examples/prometheus-servicemonitor.yaml \
            k8s/examples/tetragon-tracingpolicy.yaml \
            k8s/examples/overlays/cilium/cilium-l7-policy.yaml \
            k8s/examples/overlays/prometheus/prometheus-servicemonitor.yaml \
            k8s/examples/overlays/tetragon/tetragon-tracingpolicy.yaml

      - name: Apply and smoke-test the generic multi-role example
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" apply -f "${RUNNER_TEMP}/pacman-multi-role.yaml"
          for deployment in pacman-web pacman-score pacman-user; do
            kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" rollout status "deployment/$deployment" --timeout=180s
          done
          for identity in 'web:app=pacman,role=web' 'score:app=pacman,role=score' 'user:app=pacman,role=user'; do
            role="${identity%%:*}"
            selector="${identity#*:}"
            node tools/check-kubernetes-image-identity.js role \
              --kubeconfig "$PACMAN_KUBECONFIG" \
              --namespace "$PACMAN_NAMESPACE" \
              --selector "$selector" \
              --role "$role" \
              --image "$PACMAN_IMAGE" \
              --image-id "$PACMAN_IMAGE_ID" \
              --revision "$PACMAN_CHECKOUT_SHA"
          done

      - name: Apply and smoke-test the PostgreSQL example
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" apply -f "${RUNNER_TEMP}/pacman-postgres.yaml"
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" rollout status deployment/postgres --timeout=180s
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" wait --for=condition=complete job/pacman-postgres-migrate --timeout=180s
          kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" rollout status deployment/pacman-postgres --timeout=180s
          node tools/check-kubernetes-image-identity.js role \
            --kubeconfig "$PACMAN_KUBECONFIG" \
            --namespace "$PACMAN_NAMESPACE" \
            --selector 'app=pacman,backend=postgres' \
            --role web \
            --image "$PACMAN_IMAGE" \
            --image-id "$PACMAN_IMAGE_ID" \
            --revision "$PACMAN_CHECKOUT_SHA"
          node tools/check-kubernetes-image-identity.js migration \
            --kubeconfig "$PACMAN_KUBECONFIG" \
            --namespace "$PACMAN_NAMESPACE" \
            --job pacman-postgres-migrate \
            --image "$PACMAN_IMAGE" \
            --image-id "$PACMAN_IMAGE_ID"

      - name: Collect cluster diagnostics
        if: failure()
        run: |
          if [[ -n "${PACMAN_KUBECONFIG:-}" && -n "${PACMAN_NAMESPACE:-}" ]]; then
            kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" get pods,deployments,jobs,events --sort-by=.lastTimestamp || true
            kubectl --kubeconfig "$PACMAN_KUBECONFIG" -n "$PACMAN_NAMESPACE" describe pods || true
          fi

      - name: Delete owned Kind cluster and kubeconfig
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${PACMAN_CLUSTER_NAME:-}" && -n "${PACMAN_KUBECONFIG:-}" ]]; then
            kind delete cluster --name "$PACMAN_CLUSTER_NAME" --kubeconfig "$PACMAN_KUBECONFIG" || true
            python3 -c 'from pathlib import Path; import sys; Path(sys.argv[1]).unlink(missing_ok=True)' "$PACMAN_KUBECONFIG"
          fi
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            python3 -c 'from pathlib import Path; import shutil, sys; path = Path(sys.argv[1]); shutil.rmtree(path, ignore_errors=True); [(path.parent / name).unlink(missing_ok=True) for name in ("pacman-multi-role.yaml", "pacman-postgres.yaml")]' "$RUNNER_TEMP/pacman-k8s-overlays"
          fi
