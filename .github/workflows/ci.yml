name: ci

on:
  workflow_call:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-unit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image-security:
    name: Scan pull request image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: pacman:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT_SHA=${{ github.event.pull_request.head.sha }}
            BUILD_DATE=${{ github.event.pull_request.updated_at }}

      - name: Scan pull request image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pacman:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pull-request-image

  adapter-tests:
    permissions:
      contents: read
    # Temporary Mongo compatibility bridge: qualify the actual hosted kernel before Mongo starts.
    # Retire this bridge by 2027-04-17; see https://github.com/actions/runner-images/issues/14254
    # and https://raw.githubusercontent.com/actions/runner-images/main/images/ubuntu/Ubuntu2204-Readme.md.
    runs-on: ${{ matrix.runner }}
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        adapter: [mongo, postgres]
        include:
          - adapter: mongo
            runner: ubuntu-22.04
          - adapter: postgres
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Preflight Mongo CI runtime
        if: ${{ matrix.adapter == 'mongo' }}
        run: bash tools/check-pacman-lifecycle.sh --mongo-runtime-preflight
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.adapter }} adapter tests (testcontainers)
        env:
          RUN_ADAPTER_TESTS: '1'
        run: node --test --test-reporter=spec test/adapters/${{ matrix.adapter }}.test.js
      - name: Record Mongo CI runtime metadata
        if: ${{ always() && matrix.adapter == 'mongo' }}
        env:
          PACMAN_MONGO_CI_STATUS: ${{ job.status }}
        run: bash tools/check-pacman-lifecycle.sh --mongo-runtime-metadata adapter
