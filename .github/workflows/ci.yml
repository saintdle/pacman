name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image-security:
    name: Scan pull request image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: pacman:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT_SHA=${{ github.event.pull_request.head.sha }}
            BUILD_DATE=${{ github.event.pull_request.updated_at }}

      - name: Scan pull request image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pacman:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pull-request-image

  adapter-tests:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        adapter: [mongo, postgres]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.adapter }} adapter tests (testcontainers)
        env:
          RUN_ADAPTER_TESTS: '1'
        run: node --test --test-reporter=spec test/adapters/${{ matrix.adapter }}.test.js
