# docker compose --profile memory up        (app only, in-memory DB)
# docker compose --profile mongo up          (app + mongo)
# docker compose --profile postgres up       (app + postgres, runs migrations first)
#
# Pick exactly one profile. The app service joins all of them.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pacman:dev
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DB_TYPE: ${DB_TYPE:-memory}
      MONGO_SERVICE_HOST: mongo
      MY_MONGO_PORT: 27017
      MONGO_DATABASE: pacman
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pacman
      POSTGRES_USER: pacman
      POSTGRES_PASSWORD: pacman
    profiles: ["memory", "mongo", "postgres"]
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      postgres-migrate:
        condition: service_completed_successfully
        required: false

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["mongo"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pacman
      POSTGRES_USER: pacman
      POSTGRES_PASSWORD: pacman
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacman -d pacman"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["postgres"]

  postgres-migrate:
    image: pacman:dev
    command: ["node", "src/db/migrate.js"]
    environment:
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pacman
      POSTGRES_USER: pacman
      POSTGRES_PASSWORD: pacman
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["postgres"]
