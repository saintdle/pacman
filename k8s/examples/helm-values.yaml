# Values fragment for the published chart 0.7.17 and app image 0.7.16.
# App and chart versions are independent. The released image includes the opt-in
# fault and synthetic security-probe runtime; chart defaults keep them disabled.
# This file is not a Kubernetes manifest. Do not apply it with kubectl.
# Chart source tag (0.7.17) resolves to commit 1d11684428b2069aef8d4e69c37237b5b3c910a5.
# The later c24c5267340a58259cf3d7c8f337ace4c19d1d7a commit is a copy donor,
# not the published release source.
# Repository: https://saintdle.github.io/helm-charts
#
# Example from the repository root:
#   helm repo add saintdle https://saintdle.github.io/helm-charts --force-update
#   helm repo update saintdle
#   helm upgrade --install pacman saintdle/pacman --version 0.7.17 \
#     --namespace pacman-demo --create-namespace \
#     --values k8s/examples/helm-values.yaml
# This uses the published default app image 0.7.16. Override image.repository
# and image.tag only for a separately built app image.
# Create the namespace and referenced Secret before installing; see
# k8s/examples/README.md.

database: mongo

extraEnv:
  - name: MAX_LEVEL
    value: '10'
  - name: ALLOW_CLIENT_CONFIG_OVERRIDE
    value: 'false'
  - name: EBEE_MODE
    value: 'true'
  - name: ALLOW_CLIENT_EBEE_MODE_OVERRIDE
    value: 'false'
  - name: APP_VARIANT
    value: stable
  - name: APP_COLOR
    value: '#ffcc00'

demo:
  enabled: true
  existingTokenSecret: pacman-demo-token
  tokenHeader: x-demo-token

service:
  type: LoadBalancer
