# Values fragment for the published Pac-Man Helm chart.
# This file is not a Kubernetes manifest. Do not apply it with kubectl.
# Chart source: https://github.com/saintdle/helm-charts/tree/main/charts/pacman
# Repository: https://saintdle.github.io/helm-charts
#
# Example:
#   helm upgrade --install pacman saintdle/pacman \
#     --namespace pacman-demo --create-namespace \
#     --values k8s/examples/helm-values.yaml

database: mongo

extraEnv:
  - name: MAX_LEVEL
    value: "10"
  - name: ALLOW_CLIENT_CONFIG_OVERRIDE
    value: "false"
  - name: EBEE_MODE
    value: "true"
  - name: ALLOW_CLIENT_EBEE_MODE_OVERRIDE
    value: "false"
  - name: APP_VARIANT
    value: stable
  - name: APP_COLOR
    value: "#ffcc00"
  - name: DEMO_SECURITY_MODE
    value: "true"
  - name: DEMO_TOKEN_HEADER
    value: x-demo-token
  - name: DEMO_TOKEN
    value: pacman-demo

service:
  type: LoadBalancer
