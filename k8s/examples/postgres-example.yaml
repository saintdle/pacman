# Pac-Man on Kubernetes with PostgreSQL (single-deployment example)
#
# Lightweight learning example matching the in-repo style. Runs the app as a
# single deployment (no role-split) backed by PostgreSQL. A migrate Job applies
# schema before the app starts.
#
# Apply with:
#   kubectl apply -f k8s/examples/postgres-example.yaml
#   kubectl -n pacman-demo wait --for=condition=complete --timeout=120s job/pacman-postgres-migrate
#   kubectl -n pacman-demo rollout status deploy/pacman-postgres
#
# Then port-forward and play:
#   kubectl -n pacman-demo port-forward svc/pacman-postgres 8080:8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: pacman-demo
  labels:
    app.kubernetes.io/part-of: pacman
---
apiVersion: v1
kind: Secret
metadata:
  name: pacman-postgres-secret
  namespace: pacman-demo
type: Opaque
stringData:
  POSTGRES_DB: pacman
  POSTGRES_USER: pacman
  POSTGRES_PASSWORD: pacman
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pacman-postgres-data
  namespace: pacman-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pacman-demo
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # OpenShift note: the restricted-v2 SCC rejects fixed IDs outside the
        # namespace range. On OpenShift, drop fsGroup/runAsUser and keep only
        # runAsNonRoot so the SCC injects a namespace-allocated UID.
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: pacman-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: pg
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pacman-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pacman-demo
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: pg
      name: pg
---
# Run schema migrations before the app starts. Re-runnable (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: pacman-postgres-migrate
  namespace: pacman-demo
  labels:
    app: pacman
    component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: pacman
        component: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: pacman-postgres-secret
          env:
            - name: POSTGRES_HOST
              value: postgres
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."; sleep 2;
              done
      containers:
        - name: migrate
          image: docker.io/saintdle/pacman:latest
          command: ["node", "src/db/migrate.js"]
          env:
            - name: DB_TYPE
              value: postgres
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: pacman-postgres-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-postgres
  namespace: pacman-demo
  labels:
    app: pacman
    backend: postgres
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacman
      backend: postgres
  template:
    metadata:
      labels:
        app: pacman
        backend: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_TYPE
              value: postgres
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: pacman-postgres-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-postgres
  namespace: pacman-demo
  labels:
    app: pacman
    backend: postgres
spec:
  selector:
    app: pacman
    backend: postgres
  ports:
    - port: 8080
      targetPort: http
      name: http
