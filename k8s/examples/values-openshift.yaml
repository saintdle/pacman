# OpenShift override values for the Pac-Man Helm chart
# (chart: saintdle/pacman, https://github.com/saintdle/helm-charts)
#
# The chart auto-detects OpenShift and, on the restricted-v2 SCC, drops the
# fixed runAsUser/runAsGroup/fsGroup from every pod so the SCC can inject a
# namespace-allocated UID. In most cases you need NO overrides at all:
#
#   helm repo add saintdle https://saintdle.github.io/helm-charts
#   helm install pacman saintdle/pacman
#
# This file documents the two knobs you may want on OpenShift.

openShift:
  # auto (default) probes for the security.openshift.io/v1 API group.
  # Set to true to force the behaviour (handy for `helm template`), or
  # false to always keep the chart's fixed UIDs.
  enabled: auto

  sccRoleBinding:
    # Instead of dropping the fixed UIDs, bind the workloads to the
    # system:openshift:scc:nonroot-v2 ClusterRole so the fixed 999 IDs are
    # allowed. Requires cluster-admin to create the RoleBinding.
    create: false

# You normally do NOT need to set these on OpenShift: when the SCC is detected
# the chart strips runAsUser/runAsGroup/fsGroup automatically. They are shown
# here only to illustrate that runAsNonRoot and seccompProfile are preserved.
#
# podSecurityContext:
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
